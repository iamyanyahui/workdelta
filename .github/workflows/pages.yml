name: deploy-website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/update-download-stats.mjs'
      - '.github/workflows/pages.yml'
  schedule:
    # 00:17 every day in Asia/Shanghai (GitHub Actions cron uses UTC).
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update release download statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-download-stats.mjs
      - name: Save daily statistics history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/downloads.json
          git diff --cached --quiet || git commit -m "chore: update download statistics"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
