name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WorkDelta.slnx
      - name: Test
        run: dotnet test WorkDelta.slnx -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/WorkDelta.App/WorkDelta.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/WorkDelta-win-x64-portable.zip
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { & $iscc installer/WorkDelta.iss }
      - uses: actions/upload-artifact@v4
        with:
          name: WorkDelta-win-x64
          path: |
            artifacts/WorkDelta-win-x64-portable.zip
            installer/Output/*.exe
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/WorkDelta-win-x64-portable.zip
            installer/Output/*.exe
